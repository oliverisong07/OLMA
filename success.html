<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your OLMA signup is complete.">
    <title>You're on the list | OLMA</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="registration-section success-page">
        <section class="registration-success" aria-labelledby="success-title">
            <div class="success-check" aria-hidden="true">
                <svg viewBox="0 0 48 48" fill="none"><path class="success-check-path" d="m13 24 7 7 16-16" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            </div>
            <p class="registration-eyebrow">YOU'RE ON THE LIST</p>
            <h1 id="success-title">Thank you for signing up.</h1>
            <p>We appreciate your interest in OLMA. If email confirmation is enabled, check your inbox for a link to verify your account. We’ll let you know as soon as the app is ready.</p>
            <a class="success-home-link" href="index.html#home">Return to OLMA home</a>
        </section>
    </main>
</body>
</html>
